<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>poster</title>
<style>
  @font-face {
    font-family: "Caveat";
    src: url("file:///Users/andubey/Desktop/auto_insta/.claude/skills/quote-poster-generator/resources/fonts/Caveat-Variable.ttf") format("truetype-variations");
    font-weight: 400 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "Poppins";
    src: url("file:///Users/andubey/Desktop/auto_insta/.claude/skills/quote-poster-generator/resources/fonts/Poppins-SemiBold.ttf") format("truetype");
    font-weight: 600;
    font-style: normal;
    font-display: block;
  }

  :root { --ink: #2A2118; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
  }

  body {
    position: relative;
    font-family: "Poppins", sans-serif;
    background: url("file:///Users/andubey/Desktop/auto_insta/output/nothing-bothers-you-like-your-mind/background.png") no-repeat center center;
    background-size: cover;
  }

  .quote-main {
    position: absolute;
    top: 380px;
    left: 90px;
    width: 470px;
    font-family: "Caveat", cursive;
    font-weight: 700;
    font-size: var(--quote-size, 74px);
    line-height: 1.18;
    color: var(--ink);
    text-wrap: pretty;
  }

  .quote-sub {
    position: absolute;
    top: 780px;
    left: 90px;
    width: 420px;
    text-align: left;
    font-family: "Caveat", cursive;
    font-weight: 600;
    font-size: var(--sub-size, 46px);
    line-height: 1.25;
    color: var(--ink);
    text-wrap: pretty;
  }

  .handle {
    position: absolute;
    bottom: 70px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: "Poppins", sans-serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
</style>
</head>
<body>

  <div class="quote-main" data-fit="quote" data-max="74" data-min="46" data-max-lines="4">Nothing in the world can bother you as much as your own mind.</div>
  
  <div class="quote-sub" data-fit="sub" data-max="46" data-min="32" data-max-lines="3">— Sri Sri Ravi Shankar</div>
  

  <div class="handle">— @skycampusmunich</div>

<script>
window.__fit = function () {
  const results = [];
  const nodes = document.querySelectorAll("[data-fit]");
  nodes.forEach((el) => {
    const name = el.getAttribute("data-fit");
    const max = parseInt(el.getAttribute("data-max"), 10);
    const min = parseInt(el.getAttribute("data-min"), 10);
    const maxLines = parseInt(el.getAttribute("data-max-lines"), 10);
    const cssVar = name === "quote" ? "--quote-size" : "--sub-size";
    let size = max;
    let lines = countLines(el, size);
    while (lines > maxLines && size > min) {
      size -= 2;
      lines = countLines(el, size);
    }
    document.documentElement.style.setProperty(cssVar, size + "px");
    el.style.fontSize = size + "px";
    lines = countLines(el, size);
    results.push({ block: name, finalSize: size, lines: lines, overflow: lines > maxLines, maxLines: maxLines, floor: min });
  });
  return results;
};

function countLines(el, testSize) {
  const prev = el.style.fontSize;
  el.style.fontSize = testSize + "px";
  const cs = getComputedStyle(el);
  const lineHeightPx = parseFloat(cs.lineHeight);
  const height = el.scrollHeight;
  const lines = Math.max(1, Math.round(height / lineHeightPx));
  el.style.fontSize = prev;
  return lines;
}
</script>
</body>
</html>
